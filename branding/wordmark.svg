<?xml version="1.0" encoding="UTF-8"?>
<!-- Wordmark: owl mascot + "Holiday Messenger" lockup.
     Designed for site headers, email signatures, README banners.
     Tall enough to read at 32px, scales cleanly to billboard. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220"
     role="img" aria-label="Holiday Messenger">
  <title>Holiday Messenger</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#5D4037"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFE8A8"/>
    </linearGradient>
    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F9A825"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#C62828"/>
      <stop offset="100%" stop-color="#7F1010"/>
    </linearGradient>
  </defs>

  <!-- ===== Mascot block on the left (rounded festive square) ===== -->
  <g transform="translate(20 20)">
    <rect x="0" y="0" width="180" height="180" rx="40" ry="40" fill="url(#bgGrad)"/>

    <!-- Confetti dots -->
    <g fill="#FFFFFF" opacity="0.10">
      <circle cx="20"  cy="25" r="3"/>
      <circle cx="155" cy="20" r="2"/>
      <circle cx="25"  cy="155" r="2"/>
      <circle cx="158" cy="158" r="3"/>
    </g>

    <!-- Ear tufts -->
    <path d="M 60 55 L 70 38 L 75 60 Z" fill="url(#bodyGrad)"/>
    <path d="M 120 55 L 110 38 L 105 60 Z" fill="url(#bodyGrad)"/>
    <!-- Body -->
    <ellipse cx="90" cy="100" rx="42" ry="50" fill="url(#bodyGrad)"/>
    <!-- Wings -->
    <path d="M 50 100 Q 42 125 56 145 Q 60 125 60 108 Z" fill="#5D4037" opacity="0.85"/>
    <path d="M 130 100 Q 138 125 124 145 Q 120 125 120 108 Z" fill="#5D4037" opacity="0.85"/>
    <!-- Belly -->
    <ellipse cx="90" cy="115" rx="28" ry="34" fill="url(#bellyGrad)"/>

    <!-- Eyes -->
    <circle cx="76" cy="85" r="13" fill="#FFFFFF" stroke="#5D4037" stroke-width="1.2"/>
    <circle cx="104" cy="85" r="13" fill="#FFFFFF" stroke="#5D4037" stroke-width="1.2"/>
    <circle cx="76" cy="86" r="5.5" fill="#212121"/>
    <circle cx="104" cy="86" r="5.5" fill="#212121"/>
    <circle cx="78" cy="83" r="1.8" fill="#FFFFFF"/>
    <circle cx="106" cy="83" r="1.8" fill="#FFFFFF"/>

    <!-- Beak -->
    <path d="M 90 94 L 86 102 L 94 102 Z" fill="#FFC107" stroke="#C8961F" stroke-width="0.8"/>

    <!-- Envelope -->
    <rect x="68" y="115" width="44" height="28" rx="2" ry="2"
          fill="#FFFFFF" stroke="#C0A060" stroke-width="1.2"/>
    <path d="M 68 117 L 90 132 L 112 117"
          fill="none" stroke="#C0A060" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Wax seal -->
    <circle cx="90" cy="135" r="3.6" fill="#C62828" stroke="#7F1010" stroke-width="0.6"/>

    <!-- Sparkle top right -->
    <g transform="translate(150 50)">
      <circle r="9" fill="url(#sparkleGrad)"/>
      <path d="M 0 -11 L 2.2 -2.2 L 11 0 L 2.2 2.2 L 0 11 L -2.2 2.2 L -11 0 L -2.2 -2.2 Z"
            fill="#FFFFFF" opacity="0.95"/>
    </g>
  </g>

  <!-- ===== Wordmark text on the right ===== -->
  <g transform="translate(230 0)">
    <text x="0" y="115"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="78"
          font-weight="700"
          fill="url(#textGrad)"
          letter-spacing="-1">
      Holiday Messenger
    </text>
    <text x="4" y="155"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="22"
          font-style="italic"
          fill="#5D4037"
          letter-spacing="2">
      Show up. Automatically.
    </text>
    <!-- Sparkle accent at end of tagline -->
    <g transform="translate(360 148)">
      <path d="M 0 -8 L 1.6 -1.6 L 8 0 L 1.6 1.6 L 0 8 L -1.6 1.6 L -8 0 L -1.6 -1.6 Z"
            fill="#F9A825"/>
    </g>
  </g>
</svg>
