<?xml version="1.0" encoding="UTF-8"?>
<!-- Monochrome owl silhouette for Android notification icons.
     White-on-transparent, flat, no gradients, no fine detail.
     Designed to stay legible at 24dp. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     role="img" aria-label="Holiday Messenger notification">
  <title>Holiday Messenger</title>
  <g fill="#FFFFFF">
    <!-- Ear tufts -->
    <path d="M 7.5 5.5 L 9 3.5 L 9.8 6 Z"/>
    <path d="M 16.5 5.5 L 15 3.5 L 14.2 6 Z"/>
    <!-- Body -->
    <ellipse cx="12" cy="12" rx="6" ry="7"/>
    <!-- Eye holes (transparent via even-odd by carving with second path) -->
  </g>
  <!-- Eye holes carved out -->
  <g fill="#000000" fill-opacity="0">
    <!-- placeholder so the next group renders punched holes correctly -->
  </g>
  <!-- Punch eyes + envelope using a mask -->
  <defs>
    <mask id="cut">
      <rect width="24" height="24" fill="white"/>
      <!-- Eyes -->
      <circle cx="9.6" cy="10" r="1.1" fill="black"/>
      <circle cx="14.4" cy="10" r="1.1" fill="black"/>
      <!-- Envelope rectangle -->
      <rect x="8.4" y="13" width="7.2" height="4.4" rx="0.4" fill="black"/>
      <!-- Beak triangle -->
      <path d="M 12 11.2 L 11.2 12.4 L 12.8 12.4 Z" fill="black"/>
    </mask>
  </defs>
  <g mask="url(#cut)">
    <path d="M 7.5 5.5 L 9 3.5 L 9.8 6 Z" fill="#FFFFFF"/>
    <path d="M 16.5 5.5 L 15 3.5 L 14.2 6 Z" fill="#FFFFFF"/>
    <ellipse cx="12" cy="12" rx="6" ry="7" fill="#FFFFFF"/>
  </g>
  <!-- Envelope outline (drawn back in white as thin strokes) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-linejoin="round">
    <path d="M 8.4 13.2 L 12 15.4 L 15.6 13.2"/>
  </g>
  <!-- Tiny sparkle top right -->
  <path d="M 19 5 L 19.4 5.8 L 20.2 6 L 19.4 6.2 L 19 7 L 18.6 6.2 L 17.8 6 L 18.6 5.8 Z" fill="#FFFFFF"/>
</svg>
