name: Weekly Holiday Discovery & Message Agent

on:
  schedule:
    # Every Monday at 9am ET (13:00 UTC during EDT, 14:00 UTC during EST)
    - cron: '0 13 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  holiday-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Claude Code holiday agent
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            You are the weekly Holiday Messenger maintenance agent. Your job is to discover new holidays and compose fresh message templates.

            ## Current Holidays (18 total)
            Read `app/src/main/java/com/holidaymessenger/util/HolidayCalendar.kt` and
            `app/src/main/java/com/holidaymessenger/data/repository/HolidayRepository.kt`
            to confirm the current holiday list:
            1. New Year's Day (01-01)
            2. Lunar New Year (variable)
            3. Valentine's Day (02-14)
            4. Easter (variable)
            5. Passover (variable)
            6. Mother's Day (variable)
            7. Father's Day (variable)
            8. Juneteenth (06-19)
            9. Eid al-Fitr (variable)
            10. Independence Day (07-04)
            11. Eid al-Adha (variable)
            12. Rosh Hashanah (variable)
            13. Halloween (10-31)
            14. Election Day (variable)
            15. Diwali (variable)
            16. Thanksgiving (variable)
            17. Hanukkah (variable)
            18. Christmas (12-25)

            ## Step 1 — Discover New Holidays

            Search for notable US holidays, cultural observances, and awareness days in the
            next 90 days that are NOT already in the list above. Consider:
            - Federal holidays: Presidents' Day, MLK Day, Veterans Day, Memorial Day, Labor Day
            - Cultural: St. Patrick's Day, Cinco de Mayo, Indigenous Peoples' Day, Kwanzaa
            - Awareness: International Women's Day, Earth Day, World Mental Health Day
            - Any other trending or notable observances

            For each new holiday found, provide:
            - Name and date (or date rule if variable)
            - Whether it's fixed or variable
            - Suggested monthDay format (MM-dd) if fixed
            - 3 message template options using the {name} placeholder

            ## Step 2 — Compose Fresh Message Templates

            For each of the existing 18 holidays, write 3 fresh, varied message templates
            using the {name} placeholder. Messages should:
            - Feel warm, personal, and diverse in tone (casual, heartfelt, fun)
            - Be different from the current defaults in the codebase
            - Be appropriate for sending to friends, family, and acquaintances
            - Be concise (1-2 sentences max)

            ## Step 3 — Save Results

            1. Create directory `holiday-suggestions/` if it doesn't exist
            2. Write all findings to `holiday-suggestions/<today's date YYYY-MM-DD>-weekly-update.md`
            3. The markdown file should have these sections:
               - **New Holiday Discoveries** — holidays not in the current 18, with dates and messages
               - **Fresh Message Templates** — 3 new options per existing holiday
               - **Recommendations** — top 5 new holidays most worth adding and why
            4. Commit this file to a new branch `weekly-holiday-update/<today's date YYYY-MM-DD>`
            5. Push the branch

          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
          model: "claude-sonnet-4-6"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="weekly-holiday-update/${DATE}"

          # Check if branch was created by Claude
          if git rev-parse --verify "origin/${BRANCH}" 2>/dev/null; then
            git checkout "${BRANCH}"
            gh pr create \
              --title "Weekly Holiday Update — ${DATE}" \
              --body "$(cat <<'EOF'
          ## Weekly Holiday Discovery Report

          This automated PR contains:
          - **New holiday discoveries** not yet in the app's 18-holiday list
          - **Fresh message templates** (3 per existing holiday)
          - **Recommendations** for which holidays to add next

          Review the suggestions in `holiday-suggestions/${DATE}-weekly-update.md` and merge what you like.

          🤖 Generated by the Weekly Holiday Agent
          EOF
          )" \
              --base main || echo "PR may already exist or branch not pushed"
          else
            echo "No update branch found — Claude may have committed directly or found no updates"
          fi
